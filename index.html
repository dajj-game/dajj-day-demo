<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}body{overflow:hidden}

</style></head><body><div id="app">
<section id="start" class="screen"><div id="heroBlur" class="heroBlur"></div><div id="heroMain" class="heroMain"></div><div class="startcard"><div class="k">DAJJ VISUAL NOVEL <span class="demo">DEMO</span></div><h1>體驗大肌肌的一天</h1><p class="desc">你能順利度過大肌肌的一天嗎？</p><button class="primary" onclick="startGame()">START</button></div></section>

createElement("button");l.className="choice",l.innerHTML=`<b>${n[0]}</b> ${n[1]}`,l.onclick=()=>makeChoice(e,o),i.appendChild(l)})}function makeChoice(e,t){const i=E[e],n=i.opts[t],o=document.getElementById("choices");o.querySelectorAll(".choice").forEach(e=>{e.style.pointerEvents="none",e.classList.add("notpicked")});const l=o.children[t];l.classList.add("pickflash");const a=document.getElementById("fb");a.textContent=`${n[3]}`,a.style.display="inline-block",n[2]>0?(a.className="result ok",c+=n[2],l.style.animation="none"):(a.className="result no",-1===n[2]?(l.classList.add("wrongfx"),h++):(l.style.opacity=".6")),s++,setTimeout(()=>{s<E.length?showScene(s):endGame()},1800)}function endGame(){document.getElementById("game").style.display="none",document.getElementById("ending").style.display="flex";let e="";c>6?e="完美一天！":c>3?e="不錯的一天":e="還需加油";let t="";c>6?t="S":c>3?t="A":c>0?t="B":t="C",document.getElementById("score").innerHTML=`好感度: <b>${c}</b>/8`,document.getElementById("rank").innerHTML=`評分: <b>${t}</b>`,document.getElementById("summary").textContent=e}
